plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sitlani.rotichhathhayu'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sitlani.rotichhathhayu'
        minSdk 24
        targetSdk 34
        versionCode System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1
        versionName '3.1'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'sitlani123'
            keyAlias 'sitlani'
            keyPassword 'sitlani123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
