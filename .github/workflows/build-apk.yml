name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Sitlani-Roti-Chha-Thhayu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sitlani-Roti-Chha-Thhayu-APK
          path: Sitlani-Roti-Chha-Thhayu.apk

      - name: Publish to Releases (easy download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Sitlani's Roti Chha Thhayu - build ${{ github.run_number }}"
          body: "Download Sitlani-Roti-Chha-Thhayu.apk below, open it on your Android phone and install."
          files: Sitlani-Roti-Chha-Thhayu.apk
