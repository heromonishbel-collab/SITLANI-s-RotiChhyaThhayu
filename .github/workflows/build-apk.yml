
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Sitlani-Roti-Chha-Thhayu.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sitlani-Roti-Chha-Thhayu-APK
          path: Sitlani-Roti-Chha-Thhayu.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Sitlani's Roti Chha Thhayu - Build ${{ github.run_number }}"
          body: "Download the Android APK from the assets below."
          files: Sitlani-Roti-Chha-Thhayu.apk
